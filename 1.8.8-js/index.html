<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择 Minecraft 版本</title>
  <style>
    :root {
      --bg: #121212; --card-bg: #1e1e1e; --card-hover: #2a2a2a;
      --accent: #4CAF50; --text: #e0e0e0; --text-dim: #9e9e9e; --border: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem;
    }
    h1 {
      font-size: 2rem; margin-bottom: 0.5rem; text-align: center;
      background: linear-gradient(135deg, #4CAF50, #8BC34A);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--text-dim); margin-bottom: 2rem; text-align: center; font-size: 0.95rem; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem; width: 100%; max-width: 1100px;
    }
    .card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 1.4rem; text-decoration: none;
      color: inherit; display: flex; flex-direction: column;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .card:hover {
      transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.5);
      border-color: var(--accent); background: var(--card-hover);
    }
    .card h2 { font-size: 1.3rem; margin-bottom: .5rem; color: #fff; }
    .card p { font-size: .9rem; color: var(--text-dim); line-height: 1.5; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
    .tag {
      background: #2c2c2c; color: #b0b0b0; font-size: .75rem;
      padding: .2rem .6rem; border-radius: 20px; border: 1px solid #3a3a3a;
    }
    .tag.recommend { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    footer { margin-top: 3rem; color: #555; font-size: .8rem; text-align: center; padding-bottom: 2rem; }
  </style>
</head>
<body>
  <h1>🎮 选择 Minecraft 版本</h1>
  <p class="subtitle">点击卡片进入游戏 · 存档保存在浏览器本地，请定期导出备份</p>
  <div class="grid" id="versionGrid"></div>
  <footer>Powered by Eaglercraft · 托管于 Cloudflare Pages</footer>

  <script>
    // ====== 根据你的 GitHub 仓库实际文件夹修改这里 ======
    const versions = [
      {
        name: '1.8.8 (JS)',
        desc: '经典版本，兼容性最好，支持移动触屏操作。',
        tags: ['推荐', '移动端', 'JS'],
        path: './1.8.8-js/' 
      },
      {
        name: '1.5.2 经典版',
        desc: 'Eaglercraft 最初版本，稳定性强，怀旧首选。',
        tags: ['怀旧', '经典'],
        path: './1.5.2-js/' 
      }
      // 以后有新的版本，按上面的格式往下加即可，比如：
      // {
      //   name: '1.12.2 (WASM)',
      //   desc: '较新版本，支持红石更新、命令方块等。',
      //   tags: ['WASM', '新特性'],
      //   path: './1.12.2-wasm/' 
      // }
    ];

    const grid = document.getElementById('versionGrid');
    versions.forEach(v => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = v.path;
      const tagsHtml = v.tags.map(t =>
        `<span class="${t === '推荐' ? 'tag recommend' : 'tag'}">${t}</span>`
      ).join('');
      card.innerHTML = `<h2>${v.name}</h2><p>${v.desc}</p><div class="tags">${tagsHtml}</div>`;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
